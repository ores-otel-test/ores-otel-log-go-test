name: Exact-head go conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: canonical
            repository: ores-otel/ores.otel.log
            ref: 9f633f17db3fe4f205273e164c63b80e6da6ca0e
          - role: legacy
            repository: ORESoftware/next-loggers.ts
            ref: be37556eeeaa77c2fc57feda96239b69cca8e9ac
    steps:
      - name: Check out harness
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: source/.github/workflows/contracts.yml

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate JSON Schema and logical SDK contract
        env:
          EXPECTED_LANGUAGE: go
          EXPECTED_REPOSITORY: ${{ matrix.repository }}
          EXPECTED_REF: ${{ matrix.ref }}
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0 referencing==0.37.0
          python source/scripts/validate-contracts.py
          python tests/assert_contract.py source conformance.json

      - name: Run native go SDK checks
        shell: bash
        run: |
          cd source/sdk/go
          go test -race ./...
